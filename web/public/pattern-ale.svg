<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <!-- エールの泡：ヒーロー右奥にごく薄く敷く装飾。tide系のみ・最大不透明度0.14 -->
  <!-- 下から上へ、泡は小→大。列は3本の緩い揺らぎ -->
  <g fill="none">
    <!-- 左の列 -->
    <circle cx="96"  cy="612" r="3"  fill="#0f8c8d" opacity="0.10"/>
    <circle cx="104" cy="548" r="4"  fill="#0f8c8d" opacity="0.11"/>
    <circle cx="92"  cy="472" r="5"  fill="#2bacac" opacity="0.10"/>
    <circle cx="108" cy="392" r="6"  fill="#0f8c8d" opacity="0.12"/>
    <circle cx="98"  cy="304" r="7"  fill="#2bacac" opacity="0.11"/>
    <circle cx="112" cy="212" r="8"  fill="#0f8c8d" opacity="0.10"/>
    <circle cx="100" cy="116" r="10" fill="#5fc9c9" opacity="0.09"/>
    <!-- 中央の列 -->
    <circle cx="242" cy="596" r="2.5" fill="#238c68" opacity="0.10"/>
    <circle cx="236" cy="520" r="4"   fill="#0f8c8d" opacity="0.10"/>
    <circle cx="250" cy="436" r="5"   fill="#2bacac" opacity="0.12"/>
    <circle cx="238" cy="344" r="6.5" fill="#238c68" opacity="0.10"/>
    <circle cx="252" cy="248" r="8"   fill="#0f8c8d" opacity="0.11"/>
    <circle cx="240" cy="144" r="9.5" fill="#2bacac" opacity="0.09"/>
    <circle cx="254" cy="52"  r="11"  fill="#5fc9c9" opacity="0.08"/>
    <!-- 右の列 -->
    <circle cx="382" cy="624" r="3"  fill="#0f8c8d" opacity="0.11"/>
    <circle cx="390" cy="556" r="4.5" fill="#2bacac" opacity="0.10"/>
    <circle cx="378" cy="476" r="5.5" fill="#0f8c8d" opacity="0.11"/>
    <circle cx="394" cy="388" r="7"  fill="#238c68" opacity="0.10"/>
    <circle cx="384" cy="292" r="8.5" fill="#0f8c8d" opacity="0.12"/>
    <circle cx="396" cy="188" r="10" fill="#2bacac" opacity="0.10"/>
    <circle cx="386" cy="80"  r="12" fill="#5fc9c9" opacity="0.08"/>
    <!-- 泡のハイライト（大きい泡にだけ、輪郭の弧） -->
    <path d="M 94 110 a 10 10 0 0 1 12 -4" stroke="#5fc9c9" stroke-width="1.2" opacity="0.12" stroke-linecap="round"/>
    <path d="M 248 46 a 11 11 0 0 1 13 -4" stroke="#5fc9c9" stroke-width="1.2" opacity="0.11" stroke-linecap="round"/>
    <path d="M 380 74 a 12 12 0 0 1 14 -4" stroke="#5fc9c9" stroke-width="1.2" opacity="0.11" stroke-linecap="round"/>
  </g>
</svg>
